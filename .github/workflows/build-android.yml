name: Compilar Android App en la Nube

on:
  push:
    branches: [ "main", "master", "fix/reels-video-performance" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_APP_TARGET: android
      VITE_BACKEND_URL: https://carlos02200375720mall-113642516090.europe-west1.run.app

    steps:
      - name: Descargar código actual
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar frontend Android desde cero
        env:
          VITE_APP_TARGET: android
          VITE_BACKEND_URL: https://carlos02200375720mall-113642516090.europe-west1.run.app
        run: |
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --force
          rm -rf dist
          npm run build:android
          test -f dist/index.html

      - name: Inicializar y sincronizar Capacitor
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/status-bar
          npx cap add android || true
          npx cap sync android
          if [ -f "src/app/android/AndroidManifest.xml" ] && [ -d "android/app/src/main" ]; then
            cp src/app/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Corregir clases duplicadas de Kotlin
        run: |
          node -e "const fs=require('fs'); const f='android/build.gradle'; if(fs.existsSync(f)){const p='\\nsubprojects {\\n    configurations.all {\\n        exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk7\'\\n        exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk8\'\\n    }\\n}\\n'; fs.appendFileSync(f,p)}"

      - name: Compilar APK Debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
