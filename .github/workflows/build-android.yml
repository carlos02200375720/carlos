name: Compilar Android App en la Nube

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Instalar dependencias
        run: |
          npm install

      - name: 5. Reparar binario nativo de Tailwind y Compilar Web
        run: |
          npm install @tailwindcss/oxide-linux-x64-gnu --save-optional --force
          npm run build

      - name: 6. Agregar plataforma Android y Sincronizar
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/status-bar
          npx cap add android || true
          npx cap sync android

      - name: 6.1. Corregir clases duplicadas de Kotlin
        run: |
          node -e "
          const fs = require('fs');
          const file = 'android/build.gradle';
          const patch = \`\nsubprojects {\n    configurations.all {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n\`;
          fs.appendFileSync(file, patch);
          console.log('Parche de Kotlin aplicado correctamente');
          "

      - name: 7. Permisos de Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK de Android (Modo Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 9. Guardar APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk