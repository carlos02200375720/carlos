name: Compilar Android App en la Nube

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar dependencias
        run: npm install

      - name: 5. Compilar proyecto Web
        run: npm run build

      - name: 6. Configurar Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Permisos de Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK de Android
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 9. Guardar APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-android-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk