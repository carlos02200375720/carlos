name: One-time server modularization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move server models and GCS configuration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('server.ts')
          text = p.read_text(encoding='utf-8')

          models_import = '''import {\n  MongoUser,\n  MongoPublicacion,\n  MongoProduct,\n  MongoReel,\n  MongoCart,\n  MongoOrder,\n} from "./src/server/models";'''
          storage_import = 'import { bucket } from "./src/server/config/storage";'

          if 'from "./src/server/models"' not in text:
              marker = 'import { createAndroidRouter } from "./src/server/androidRouter";'
              text = text.replace(marker, marker + '\n' + models_import + '\n' + storage_import, 1)

          model_start = text.find('// Mongoose User Schema')
          gcs_start = text.find('// Google Cloud Storage setup')
          if model_start == -1 or gcs_start == -1 or gcs_start <= model_start:
              raise SystemExit('Expected model/config blocks were not found; refusing to modify server.ts')

          model_block = '''const cartMemoryStore = new Map<string, any[]>();\n\n'''
          text = text[:model_start] + model_block + text[gcs_start:]

          gcs_end_marker = 'const bucket = storage.bucket(bucketName);'
          gcs_end = text.find(gcs_end_marker)
          if gcs_end == -1:
              raise SystemExit('Expected GCS bucket initialization was not found; refusing to modify server.ts')
          gcs_end += len(gcs_end_marker)
          text = text[:gcs_start] + text[gcs_end:]

          p.write_text(text, encoding='utf-8')
          PY

          grep -q 'from "./src/server/models"' server.ts
          grep -q 'from "./src/server/config/storage"' server.ts
          ! grep -q 'const UserSchema = new mongoose.Schema' server.ts
          ! grep -q 'const ReelSchema = new mongoose.Schema' server.ts

      - name: Commit modularization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "refactor(server): migrate models and storage config" || exit 0
          git push origin main

      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-server-modularization.yml
          git add .github/workflows/one-time-server-modularization.yml
          git commit -m "chore: remove one-time server modularization workflow" || exit 0
          git push origin main
