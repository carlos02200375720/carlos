name: Optimize Reels Playback
on:
  push:
    branches: [fix/reels-video-performance]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply playback cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/app/web/ReelsView.tsx')
          text = path.read_text()
          text = text.replace('import React, { useState, useEffect, useRef, useCallback, memo } from "react";\n', 'import React, { useState, useEffect, useRef, useCallback, memo } from "react";\nimport Hls from "hls.js";\n')
          text = re.sub(r'\n  const \[hasUserInteracted, setHasUserInteracted\] = useState\(false\);', '', text)
          text = re.sub(r'\n  // Listen for user interaction.*?\n  \}, \[\]\);\n', '\n', text, flags=re.S)
          text = re.sub(r'\n  // Master synchronization effect:.*?\n  \}, \[activeReelIndex, isPlaying, isMuted, activeVideoElement, playVideoSafely\]\);\n', '\n', text, flags=re.S)

          old_scroll = re.search(r'  const handleScroll = \(e: React\.UIEvent<HTMLDivElement>\) => \{.*?\n  \};\n\n  const handleToggleMute', text, flags=re.S)
          new_scroll = '''  const handleScroll = (e: React.UIEvent<HTMLDivElement>) => {
    const container = e.currentTarget;
    const childHeight = container.clientHeight;
    if (!childHeight) return;

    const index = Math.round(container.scrollTop / childHeight);
    if (index !== activeReelIndex && index >= 0 && index < displayedReels.length) {
      setActiveReelIndex(index);
      setActiveVideoElement(null);
      setIsPlaying(true);
    }

    if (index >= displayedReels.length - 2 && reels.length > 0) {
      setDisplayCount((prev) => prev + Math.min(reels.length, 10));
    }
  };

  const handleToggleMute'''
          if not old_scroll:
              raise SystemExit('handleScroll block not found')
          text = text[:old_scroll.start()] + new_scroll + text[old_scroll.end():]

          old_click = re.search(r'  const handleVideoClick = \(e: React\.MouseEvent, index: number\) => \{.*?\n  \};\n\n  const isGuestUser', text, flags=re.S)
          new_click = '''  const handleVideoClick = (e: React.MouseEvent, index: number) => {
    e.stopPropagation();
    if (index !== activeReelIndex) return;
    const video = videoRefs.current[index];
    if (!video) return;

    if (video.paused) {
      video.muted = isMuted;
      video.defaultMuted = isMuted;
      video.volume = isMuted ? 0 : 1.0;
      video.play().then(() => setIsPlaying(true)).catch(() => {});
    } else {
      video.pause();
      setIsPlaying(false);
    }
  };

  const isGuestUser'''
          if not old_click:
              raise SystemExit('handleVideoClick block not found')
          text = text[:old_click.start()] + new_click + text[old_click.end():]

          text = text.replace('{Math.abs(index - activeReelIndex) <= 2 ? (', '{isCurrent ? (')

          video_block = re.search(r'const ReelVideoItem = memo\(function ReelVideoItem.*?\n\}\);\n$', text, flags=re.S)
          if not video_block:
              raise SystemExit('ReelVideoItem block not found')
          new_video = '''const ReelVideoItem = memo(function ReelVideoItem({ reel, index, isCurrent, isPlaying, isMuted, mediaAspectRatio, onVideoClick, onDoubleTap, onAspectRatioDetected, onRegisterRef }: ReelVideoItemProps) {
  const videoRef = useRef<HTMLVideoElement | null>(null);
  const isPlayingRef = useRef(isPlaying);
  isPlayingRef.current = isPlaying;

  const rawVid = reel.videoUrl || (reel.thumbnailUrl?.endsWith(".mp4") ? reel.thumbnailUrl : "");
  const videoSrc = rawVid && rawVid.trim().length > 0 ? rawVid.trim() : undefined;
  const hlsSrc = reel.hlsUrl?.trim() || undefined;
  const posterUrl = reel.thumbnailUrl && !reel.thumbnailUrl.includes("1618005182384") && !reel.thumbnailUrl.endsWith(".mp4") ? reel.thumbnailUrl : undefined;

  useEffect(() => {
    const video = videoRef.current;
    if (!video || !isCurrent || !hlsSrc) return;

    let hls: Hls | null = null;
    let cancelled = false;

    const useNativeHls = video.canPlayType("application/vnd.apple.mpegurl") !== "" && !Hls.isSupported();
    if (useNativeHls) {
      video.src = hlsSrc;
      video.load();
    } else if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 6,
        maxBufferLength: 20,
        maxMaxBufferLength: 40,
        maxBufferHole: 0.5,
        startLevel: 0,
        capLevelToPlayerSize: true,
        abrEwmaDefaultEstimate: 650000,
        abrBandWidthFactor: 0.8,
        abrBandWidthUpFactor: 0.7,
        fragLoadingMaxRetry: 3,
        fragLoadingRetryDelay: 500,
      });

      hls.loadSource(hlsSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_event, data) => {
        if (cancelled || !data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          hls?.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls?.recoverMediaError();
        }
      });
    }

    return () => {
      cancelled = true;
      hls?.destroy();
    };
  }, [hlsSrc, isCurrent]);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    video.muted = isMuted;
    video.defaultMuted = isMuted;
    video.volume = isMuted ? 0 : 1.0;

    if (isCurrent && isPlaying) {
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  }, [isCurrent, isPlaying, isMuted]);

  const handleRef = useCallback((el: HTMLVideoElement | null) => {
    videoRef.current = el;
    if (el) {
      el.muted = isMuted;
      el.defaultMuted = isMuted;
      el.volume = isMuted ? 0 : 1.0;
    }
    onRegisterRef(index, el);
  }, [index, isMuted, onRegisterRef]);

  useEffect(() => {
    return () => {
      const video = videoRef.current;
      if (video) {
        try { video.pause(); } catch {}
      }
      onRegisterRef(index, null);
    };
  }, [index, onRegisterRef]);

  const handleLoadedMetadata = (e: React.SyntheticEvent<HTMLVideoElement>) => {
    const video = e.currentTarget;
    if (video.videoHeight && video.videoWidth) {
      const ratio = video.videoWidth / video.videoHeight;
      let detected: 'vertical' | 'square' | 'horizontal' = 'vertical';
      if (ratio > 1.15) detected = 'horizontal';
      else if (ratio >= 0.85 && ratio <= 1.15) detected = 'square';
      onAspectRatioDetected(reel.id, detected);
    }
  };

  return (
    <video
      ref={handleRef}
      src={hlsSrc && Hls.isSupported() ? undefined : (hlsSrc ? hlsSrc : videoSrc)}
      poster={posterUrl}
      autoPlay={isCurrent}
      playsInline
      loop
      muted={isMuted}
      preload="none"
      className={`w-full h-full block relative z-10 select-none cursor-pointer object-center ${(mediaAspectRatio === 'vertical' || !mediaAspectRatio) ? "object-cover md:object-contain" : "object-contain"}`}
      style={{ touchAction: "pan-y" }}
      onClick={(e) => onVideoClick(e, index)}
      onDoubleClick={(e) => { e.stopPropagation(); onDoubleTap(reel.id); }}
      onLoadedMetadata={handleLoadedMetadata}
    />
  );
});
'''
          text = text[:video_block.start()] + new_video
          path.write_text(text)
      - name: Remove obsolete workflow and commit
        run: |
          rm -f .github/workflows/optimize-reels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/web/ReelsView.tsx .github/workflows/optimize-reels.yml
          git commit -m 'fix(reels): use single active HLS player' || exit 0
          git push
