<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="50%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Glowing background ambient -->
  <circle cx="256" cy="270" r="140" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Shopping Bag Outline & Handles -->
  <path d="M180 190 C180 135 332 135 332 190" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" fill="none"/>
  
  <!-- Bag Body -->
  <path d="M120 200 L145 400 C148 425 168 440 195 440 L317 440 C344 440 364 425 367 400 L392 200 Z" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Play / Live Stream symbol in center -->
  <polygon points="230,265 230,365 315,315" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Live Pulse Dot -->
  <circle cx="370" cy="180" r="16" fill="#ef4444"/>
  <circle cx="370" cy="180" r="26" stroke="#ef4444" stroke-width="4" opacity="0.5"/>
</svg>
