<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MallSocial | Social & Shopping Live</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MallSocial" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* Completely eliminate all scrollbars across all browsers, containers, and webviews */
      *, *::before, *::after, html, body, #root, div, main, section, nav, aside, ul, ol, textarea {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar,
      ::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      div::-webkit-scrollbar,
      main::-webkit-scrollbar,
      section::-webkit-scrollbar,
      nav::-webkit-scrollbar,
      aside::-webkit-scrollbar,
      ul::-webkit-scrollbar,
      ol::-webkit-scrollbar,
      textarea::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
        -webkit-appearance: none !important;
        opacity: 0 !important;
      }
      *::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-track,
      ::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
