<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MallSocial | Social & Shopping Live</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MallSocial" />
    <meta name="color-scheme" content="dark" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        overflow: hidden;
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .preloader-glow {
        position: absolute;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(236, 72, 153, 0.15) 50%, transparent 70%);
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .preloader-icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(168, 85, 247, 0.35);
        object-fit: cover;
        position: relative;
        z-index: 2;
      }
      .preloader-title {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
        z-index: 2;
      }
      .preloader-subtitle {
        margin-top: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.05em;
        position: relative;
        z-index: 2;
      }
      .preloader-spinner {
        margin-top: 24px;
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ec4899;
        border-right-color: #a855f7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        position: relative;
        z-index: 2;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(0.9); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader">
      <div class="preloader-glow"></div>
      <img src="/app-icon.jpg" alt="MallSocial" class="preloader-icon" onerror="this.src='/favicon.svg'" />
      <div class="preloader-title">MallSocial</div>
      <div class="preloader-subtitle">Social & Shopping Live</div>
      <div class="preloader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
